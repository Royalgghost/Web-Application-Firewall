# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Protocol Enforcement
# ------------------------------------------------------------------------

# 920100: Invalid HTTP Method Enforcement
SecRule REQUEST_METHOD "!@rx ^(?:GET|HEAD|POST|OPTIONS|PUT|DELETE|PATCH)$" \
    "id:920100,\
    phase:1,\
    block,\
    t:none,\
    msg:'Method is not allowed by policy',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'application-multi',\
    tag:'attack-protocol',\
    setvar:'tx.anomaly_score=+5'"

# 920200: Missing Host Header in HTTP/1.1
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:920200,\
    phase:1,\
    block,\
    t:none,\
    msg:'Request Missing a Host Header',\
    log,\
    auditlog,\
    severity:'WARNING',\
    tag:'attack-protocol',\
    setvar:'tx.anomaly_score=+3'"

# 920230: Null Byte Injection Detection
SecRule ARGS|REQUEST_HEADERS|REQUEST_URI|REQUEST_BODY "@rx (?:%00|\\x00|\0)" \
    "id:920230,\
    phase:2,\
    block,\
    t:none,\
    msg:'Multiple URL Encoding or Null Byte Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-protocol',\
    setvar:'tx.anomaly_score=+5'"
