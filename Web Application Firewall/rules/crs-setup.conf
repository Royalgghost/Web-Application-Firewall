# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set (CRS) - Setup Configuration
# ------------------------------------------------------------------------

SecRuleEngine On
SecDefaultAction "phase:2,log,auditlog,pass"

# Set the inbound anomaly score threshold (default: 5)
# In anomaly scoring mode, if the total accumulated anomaly score
# is greater than or equal to this threshold, the request is blocked.
SecAction \
    "id:900000,\
    phase:1,\
    pass,\
    nolog,\
    setvar:'tx.inbound_anomaly_score_threshold=5',\
    setvar:'tx.blocking_paranoia_level=1'"
