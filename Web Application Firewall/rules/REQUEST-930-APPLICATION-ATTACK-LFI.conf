# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Local File Inclusion (LFI) & Path Traversal
# ------------------------------------------------------------------------

# 930100: Path Traversal Attack (/../ or \..\)
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:(?:\\.{2}[/\\\\])+|(?:%2e%2e[/\\\\])+|(?:%252e%252e[/\\\\])+)" \
    "id:930100,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'Path Traversal Attack (/../) Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'application-multi',\
    tag:'attack-lfi',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.lfi_score=+5'"

# 930110: Access to OS System Configuration Files (Unix / Windows)
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:/(?:etc|proc|sys|var)/(?:passwd|shadow|hosts|issue|version)|boot\\.ini|win\\.ini|system\\.ini|windows[/\\\\]system32)" \
    "id:930110,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'OS File Access Attempt (passwd / win.ini / boot.ini)',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-lfi',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.lfi_score=+5'"

# 930120: Restricted PHP wrappers (php://, data://, zip://, expect://)
SecRule REQUEST_URI|ARGS|REQUEST_BODY "@rx (?:php://filter|php://input|data://text|expect://|zip://)" \
    "id:930120,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'Dangerous PHP File Inclusion Wrapper Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-lfi',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.lfi_score=+5'"
