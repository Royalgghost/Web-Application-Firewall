# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Scanner Detection
# ------------------------------------------------------------------------

# 913100: Detect automated security scanner User-Agents
SecRule REQUEST_HEADERS:User-Agent "@rx (?:sqlmap|nikto|acunetix|nessus|nmap|masscan|wpscan|dirbuster|gobuster|hydra|arachni|havij|netsparker|openvas|zgrab)" \
    "id:913100,\
    phase:1,\
    block,\
    t:none,t:lowercase,\
    msg:'Found User-Agent associated with automated security scanner',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-reputation-scanner',\
    setvar:'tx.anomaly_score=+5'"

# 913120: Detect scanner specific headers
SecRule REQUEST_HEADERS_NAMES "@rx (?:acunetix|nessus|openvas|x-scanner|x-originating-ip)" \
    "id:913120,\
    phase:1,\
    block,\
    t:none,t:lowercase,\
    msg:'Scanner specific HTTP header detected',\
    log,\
    auditlog,\
    severity:'HIGH',\
    tag:'attack-reputation-scanner',\
    setvar:'tx.anomaly_score=+4'"
