# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Cross-Site Scripting (XSS)
# ------------------------------------------------------------------------

# 941100: Script Tag Injection
SecRule ARGS|REQUEST_URI|REQUEST_BODY|REQUEST_HEADERS "@rx <\\s*script[^>]*>" \
    "id:941100,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:htmlEntityDecode,t:lowercase,\
    msg:'XSS Filter - Category 1: Script Tag Vector',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.xss_score=+5'"

# 941110: HTML Event Handler Attributes (e.g. onload, onerror, onclick)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:on(?:load|error|click|mouseover|focus|blur|submit|keydown|mouseenter|pointerover)\\s*=)" \
    "id:941110,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:htmlEntityDecode,t:lowercase,\
    msg:'XSS Filter - Category 2: Inline Event Handler Injection',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.xss_score=+5'"

# 941120: JavaScript / VBScript / Data URIs
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:(?:javascript|vbscript|data):[\\s\\S]*?[;\\(]|expression\\s*\\()" \
    "id:941120,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:htmlEntityDecode,t:lowercase,\
    msg:'XSS Filter - Category 3: JavaScript Pseudo-Protocol URI Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.xss_score=+5'"

# 941130: Dangerous HTML Tags (iframe, object, embed, svg onload, body, img onerror)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx <(?:iframe|object|embed|svg|applet|meta)[^>]*>" \
    "id:941130,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:htmlEntityDecode,t:lowercase,\
    msg:'XSS Filter - Category 4: Dangerous HTML Tag Insertion',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-xss',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.xss_score=+5'"

# 941140: Document / Window Manipulation (document.cookie, document.location, alert, prompt)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:document\\.(?:cookie|domain|location)|window\\.location|eval\\s*\\(|alert\\s*\\(|prompt\\s*\\()" \
    "id:941140,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'XSS Filter - Category 5: JavaScript Execution or DOM Access Detected',\
    log,\
    auditlog,\
    severity:'HIGH',\
    tag:'attack-xss',\
    setvar:'tx.anomaly_score=+4',\
    setvar:'tx.xss_score=+4'"
