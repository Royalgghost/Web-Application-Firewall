# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Server-Side Request Forgery (SSRF)
# ------------------------------------------------------------------------

# 944100: Cloud Metadata Endpoint Access (AWS, GCP, Azure, DigitalOcean)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:169\\.254\\.169\\.254|metadata\\.google\\.internal|100\\.100\\.100\\.200)" \
    "id:944100,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SSRF: Cloud Provider Instance Metadata Endpoint Probing',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-ssrf',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.ssrf_score=+5'"

# 944110: Localhost / Loopback / Private Network SSRF Targets
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:https?://(?:localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\]|10\\.[0-9.]+|192\\.168\\.[0-9.]+))" \
    "id:944110,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SSRF: Internal Network or Loopback Address Destination',\
    log,\
    auditlog,\
    severity:'HIGH',\
    tag:'attack-ssrf',\
    setvar:'tx.anomaly_score=+4',\
    setvar:'tx.ssrf_score=+4'"

# 944120: Dangerous URI Protocols in Arguments (file://, dict://, gopher://, ldap://)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:file://|gopher://|dict://|ldap://|jar://)" \
    "id:944120,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SSRF: Dangerous URI Protocol Handler Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-ssrf',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.ssrf_score=+5'"
