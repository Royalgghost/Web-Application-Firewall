# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Remote Code Execution (RCE) / Command Injection
# ------------------------------------------------------------------------

# 932100: Remote Command Execution - System Command Injection
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:(?:;|\\||`|&&|\\|\\||\\$\\()\\s*(?:cat|ls|id|whoami|uname|netcat|nc|wget|curl|bash|sh|powershell|cmd|cmd\\.exe|type|net\\s+user|dir))" \
    "id:932100,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'Remote Command Execution (RCE): Shell Command Chaining Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-rce',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.rce_score=+5'"

# 932110: Unix / Windows Shell Execution commands
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:/bin/(?:bash|sh|zsh|dash)|cmd\\.exe|powershell(?:\\.exe)?|wscript\\.exe|cscript\\.exe)" \
    "id:932110,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'Direct Shell Binary Execution Invocation',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-rce',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.rce_score=+5'"

# 932150: Reverse Shell / Network Payload Indicators
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:nc(?:\\.exe)?\\s+-(?:e|c)\\s+|/dev/tcp/[0-9.]+/|mkfifo\\s+/tmp/)" \
    "id:932150,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'Reverse Shell Command Payload Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-rce',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.rce_score=+5'"
