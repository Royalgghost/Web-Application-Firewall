# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - Blocking Evaluation
# ------------------------------------------------------------------------

# 949110: Inbound Anomaly Score Evaluation
# If cumulative score >= threshold, trigger block
SecRule TX:anomaly_score "@ge %{tx.inbound_anomaly_score_threshold}" \
    "id:949110,\
    phase:2,\
    block,\
    t:none,\
    msg:'Inbound Anomaly Score Exceeded (Total Score: %{TX.anomaly_score}, Threshold: %{tx.inbound_anomaly_score_threshold})',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'anomaly-evaluation',\
    setvar:'tx.blocking=1'"
