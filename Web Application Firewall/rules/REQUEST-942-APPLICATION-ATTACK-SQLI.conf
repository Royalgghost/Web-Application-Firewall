# ------------------------------------------------------------------------
# OWASP ModSecurity Core Rule Set - SQL Injection (SQLi)
# ------------------------------------------------------------------------

# 942100: SQL Injection - Common Boolean Bypass (' OR 1=1)
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:'|\")\\s*(?:or|and)\\s*(?:'?[0-9a-z]+'?\\s*=\\s*'?[0-9a-z]+'?|true|false|[0-9]+\\s*=\\s*[0-9]+)" \
    "id:942100,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SQL Injection Attack: Common Boolean Logic Tautology Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.sql_injection_score=+5'"

# 942110: SQL Injection - UNION Based Query Detection
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\\bunion\\b\\s+(?:all\\s+)?\\bselect\\b)" \
    "id:942110,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,t:compressWhitespace,\
    msg:'SQL Injection Attack: UNION SELECT Query Injection Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.sql_injection_score=+5'"

# 942120: SQL Injection - SQL Comment Evasion & Inline Comments
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:/\\*.*?\\*/|--\\s+.*|--$|#\\s*)" \
    "id:942120,\
    phase:2,\
    block,\
    t:none,t:urlDecode,\
    msg:'SQL Injection Attack: SQL Comment Sequences Detected',\
    log,\
    auditlog,\
    severity:'HIGH',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+4',\
    setvar:'tx.sql_injection_score=+4'"

# 942130: SQL Injection - Time-Based & Blind Injection Functions
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\\b(?:sleep|benchmark|pg_sleep)\\s*\\(|waitfor\\s+delay\\s+['\"][0-9:]+['\"])" \
    "id:942130,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SQL Injection Attack: Time-Based Blind Probe Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.sql_injection_score=+5'"

# 942140: SQL Injection - Dangerous DDL / DML Statements in Parameters
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:;\\s*(?:drop|truncate|alter)\\s+table|;\\s*(?:insert\\s+into|delete\\s+from|update\\s+[a-z0-9_]+\\s+set))" \
    "id:942140,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SQL Injection Attack: Stacked Destructive Query Detected',\
    log,\
    auditlog,\
    severity:'CRITICAL',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+5',\
    setvar:'tx.sql_injection_score=+5'"

# 942150: SQL Injection - Sensitive Database Functions & Schemas
SecRule ARGS|REQUEST_URI|REQUEST_BODY "@rx (?:\\b(?:schema|version|current_user|load_file|into\\s+outfile|into\\s+dumpfile)\\s*\\(|information_schema\\.)" \
    "id:942150,\
    phase:2,\
    block,\
    t:none,t:urlDecode,t:lowercase,\
    msg:'SQL Injection Attack: Schema Reconnaissance or File Output Attempt',\
    log,\
    auditlog,\
    severity:'HIGH',\
    tag:'attack-sqli',\
    setvar:'tx.anomaly_score=+4',\
    setvar:'tx.sql_injection_score=+4'"
